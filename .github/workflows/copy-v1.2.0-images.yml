name: Copy v1.2.0 images to the renamed path

# One-off, removed again before merge: re-tags the published v1.2.0 images
# under ghcr.io/haswanth13901/zenoeats without rebuilding, so digests match.
on:
  push:
    branches: [rename-to-zenoeats]

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for image in api web; do
            docker buildx imagetools create --prefer-index=false \
              --tag "ghcr.io/haswanth13901/zenoeats/$image:v1.2.0" \
              "ghcr.io/haswanth13901/zenoeats-mvp/$image:v1.2.0"
            old=$(docker buildx imagetools inspect "ghcr.io/haswanth13901/zenoeats-mvp/$image:v1.2.0" --format '{{json .Manifest.Digest}}')
            new=$(docker buildx imagetools inspect "ghcr.io/haswanth13901/zenoeats/$image:v1.2.0" --format '{{json .Manifest.Digest}}')
            echo "$image old=$old new=$new"
            test "$old" = "$new"
          done
